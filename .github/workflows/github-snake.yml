name: GitHub Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-snake.svg"
      - "assets/github-snake-dark.svg"
      - "updates.txt"
      - "gitartwork.svg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Generate GitHub contributions snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy snake assets into repo
        run: |
          mkdir -p assets
          if [ -f dist/github-snake.svg ]; then
            cp dist/github-snake.svg assets/github-snake.svg
          fi
          if [ -f dist/github-snake-dark.svg ]; then
            cp dist/github-snake-dark.svg assets/github-snake-dark.svg
          fi

      - name: Commit and push snake assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add assets/github-snake.svg assets/github-snake-dark.svg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate snake animation [skip ci]"
            git push origin HEAD:main
          fi
