name: GitHub Snake Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  workflow: write

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflow: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Generate GitHub contributions snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: hamzaali-712
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy generated snake asset to local path
        run: |
          mkdir -p assets
          if [ -f dist/github-snake.svg ]; then
            cp dist/github-snake.svg assets/github-snake.svg
          fi
          if [ -f dist/github-snake-dark.svg ]; then
            cp dist/github-snake-dark.svg assets/github-snake-dark.svg
          fi

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: snake-assets
          path: dist

      - name: Commit and push generated snake asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          if [ ! -f assets/github-snake.svg ]; then
            echo "No generated snake SVG to commit"
            exit 0
          fi
          git add assets/github-snake.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "generated github-snake.svg"
          git push origin HEAD:main
