name: Gitartwork Contribution Graph

on:
  schedule:
    - cron: "0 1 * * 0"   # weekly on Sundays at 01:00 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "gitartwork.svg"
      - "updates.txt"

permissions:
  contents: write

jobs:
  build:
    name: Make gitartwork SVG
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Generate gitartwork SVG
        uses: jasineri/gitartwork@v1
        with:
          user_name: hamzaali-712
          text: HAMZA ALI

      - name: Commit and push generated artwork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git add gitartwork.svg || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate gitartwork SVG [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
