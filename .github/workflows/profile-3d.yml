name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  workflow: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
      workflow: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate 3D contribution artwork
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Normalize 3D output path
        run: |
          mkdir -p profile-3d-contrib
          if [ -f profile-3d-contrib/profile-night-rainbow.svg ]; then
            cp profile-3d-contrib/profile-night-rainbow.svg profile-3d-contrib/profile-3d.svg
          elif ls profile-3d-contrib/*.svg 2>/dev/null | grep -q .; then
            cp profile-3d-contrib/*.svg profile-3d-contrib/profile-3d.svg
          else
            echo "No generated 3D SVG found"
            exit 0
          fi

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          if [ ! -f profile-3d-contrib/profile-3d.svg ]; then
            echo "No generated profile 3D SVG to commit"
            exit 0
          fi
          if git diff --quiet HEAD -- profile-3d-contrib/profile-3d.svg; then
            echo "No changes to commit"
            exit 0
          fi
          git add profile-3d-contrib/profile-3d.svg
          git commit -m "generated profile 3D svg"
          git push origin HEAD:main
