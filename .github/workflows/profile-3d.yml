name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 2 * * 0"   # weekly on Sundays at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Generate 3D contribution artwork
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move generated SVGs to profile-3d-contrib folder
        run: |
          mkdir -p profile-3d-contrib
          if ls profile-3d-contrib/*.svg 2>/dev/null | grep -q .; then
            # Copy the recommended night-rainbow variant as the primary display file
            if [ -f profile-3d-contrib/profile-night-rainbow.svg ]; then
              cp profile-3d-contrib/profile-night-rainbow.svg profile-3d-contrib/profile-3d.svg
            else
              # Fall back to first available SVG
              first=$(ls profile-3d-contrib/*.svg | head -n 1)
              cp "$first" profile-3d-contrib/profile-3d.svg
            fi
            echo "profile-3d.svg written successfully"
          else
            echo "No 3D SVGs found — skipping"
            exit 0
          fi

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          if [ ! -f profile-3d-contrib/profile-3d.svg ]; then
            echo "Nothing to commit"
            exit 0
          fi
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate 3D contribution graph [skip ci]"
          git push origin HEAD:main
