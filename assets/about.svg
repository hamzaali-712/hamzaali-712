<svg width="380" height="320" viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="380" height="320" rx="20" fill="url(#deskGrad)"/>

  <!-- floating AI node / brain -->
  <circle cx="290" cy="70" r="46" fill="url(#brainGlow)"/>
  <g stroke="#67e8f9" stroke-width="1.4" fill="none" opacity="0.9">
    <circle cx="290" cy="70" r="26"/>
    <circle cx="290" cy="70" r="3" fill="#67e8f9" stroke="none"/>
    <line x1="290" y1="70" x2="315" y2="50"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></line>
    <line x1="290" y1="70" x2="260" y2="45"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="290" y1="70" x2="270" y2="100"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></line>
    <circle cx="315" cy="50" r="3" fill="#a78bfa" stroke="none"/>
    <circle cx="260" cy="45" r="3" fill="#a78bfa" stroke="none"/>
    <circle cx="270" cy="100" r="3" fill="#a78bfa" stroke="none"/>
  </g>

  <!-- GitHub octocat mark (simple) -->
  <g transform="translate(40,40)" fill="#e2e8f0" opacity="0.9">
    <circle cx="0" cy="0" r="16"/>
    <path d="M -8 6 Q 0 16 8 6" stroke="#0f172a" stroke-width="2" fill="none"/>
    <circle cx="-5" cy="-3" r="2" fill="#0f172a"/>
    <circle cx="5" cy="-3" r="2" fill="#0f172a"/>
  </g>

  <!-- desk surface -->
  <rect x="20" y="230" width="340" height="14" rx="4" fill="#1e293b"/>

  <!-- monitor -->
  <rect x="120" y="140" width="140" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <rect x="130" y="150" width="120" height="70" rx="4" fill="url(#screenGrad)"/>
  <g font-family="Courier New, monospace" font-size="9" fill="#a5f3fc">
    <text x="136" y="164">$ git commit -m</text>
    <text x="136" y="176">"ship AI feature"</text>
    <text x="136" y="188">> building...</text>
    <text x="136" y="200">> tests passed ✓</text>
  </g>
  <rect x="182" y="230" width="36" height="10" fill="#334155"/>
  <rect x="160" y="240" width="80" height="6" rx="3" fill="#475569"/>

  <!-- keyboard -->
  <rect x="130" y="246" width="120" height="14" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- laptop to the side -->
  <g transform="translate(240,190)">
    <rect x="0" y="0" width="80" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="6" y="6" width="68" height="38" rx="2" fill="#1e1b4b"/>
    <path d="M -6 50 L 86 50 L 96 62 L -16 62 Z" fill="#1e293b"/>
  </g>

  <!-- code brackets floating -->
  <text x="40" y="200" font-family="Courier New, monospace" font-size="26" fill="#c4b5fd" opacity="0.8">&lt;/&gt;</text>
  <text x="330" y="270" font-family="Courier New, monospace" font-size="20" fill="#67e8f9" opacity="0.7">01</text>
</svg>
